open_barrier:
  name: Открыть шлагбаум
  description: >-
    Отправляет серверу А.М.Видео команду открытия КПУ (type=open).
    Повторные команды ограничены интервалом (по умолчанию 20 с).
  target:
    entity:
      integration: amvideo
      domain: [button, cover]

regenerate_restream_token:
  name: Перевыпустить токен рестрима
  description: >-
    Генерирует новый случайный токен для локального рестрима видео
    (вход Frigate). После перевыпуска прежние ссылки перестают работать —
    новый вход показывается в опциях интеграции. Токен нигде не
    публикуется (ни в атрибутах сущностей, ни в журнале).
